name: fix-verification-build
on:
  push:
    branches:
      - "fix/**"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Generate keystore for signing
        run: |
          keytool -genkey -v -keystore /tmp/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias simplelive -storepass simplelive123 -keypass simplelive123 -dname "CN=SimpleLive, OU=Dev, O=SimpleLive, L=Beijing, ST=Beijing, C=CN"
          echo "storeFile=/tmp/release.jks" > simple_live_app/android/key.properties
          echo "storePassword=simplelive123" >> simple_live_app/android/key.properties
          echo "keyPassword=simplelive123" >> simple_live_app/android/key.properties
          echo "keyAlias=simplelive" >> simple_live_app/android/key.properties

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Analyze
        run: |
          cd simple_live_app
          dart analyze

      - name: Build APK (release)
        run: |
          cd simple_live_app
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fix-release-apk
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-release.apk

  build-windows-fix:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Analyze
        run: |
          cd simple_live_app
          dart analyze

      - name: Build Windows (release)
        run: |
          cd simple_live_app
          flutter build windows --release

      - name: Upload Windows fix
        uses: actions/upload-artifact@v4
        with:
          name: fix-release-windows
          path: |
            simple_live_app/build/windows/x64/runner/Release/

  build-windows-original:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      - name: Enable Flutter Desktop
        run: flutter config --enable-windows-desktop

      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Build Windows (release)
        run: |
          cd simple_live_app
          flutter build windows --release

      - name: Upload Windows original
        uses: actions/upload-artifact@v4
        with:
          name: original-release-windows
          path: |
            simple_live_app/build/windows/x64/runner/Release/
